<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">TextPilot</title>
  <desc id="desc">A Windows AI text assistant that reads selected text, sends a stateless request, and copies the result to the clipboard.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#9B6DFF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111A32"/>
      <stop offset="1" stop-color="#0D1428"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="390" rx="30" fill="#090E1C"/>
  <path d="M0 302 C210 244 330 384 546 316 C760 248 916 336 1200 238 L1200 390 L0 390 Z" fill="#0C1327"/>

  <g id="identity" transform="translate(62 55)">
    <g id="mark" transform="translate(0 0)">
      <path d="M18 0 H90 C101 0 110 9 110 20 V78 C110 89 101 98 90 98 H52 L31 114 V98 H18 C7 98 0 89 0 78 V20 C0 9 7 0 18 0 Z" fill="url(#panel)" stroke="url(#accent)" stroke-width="4"/>
      <path d="M55 23 C57 39 64 47 80 49 C64 51 57 59 55 75 C53 59 46 51 30 49 C46 47 53 39 55 23 Z" fill="url(#accent)"/>
    </g>

    <text x="140" y="22" fill="#8EA0C4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" letter-spacing="2">WINDOWS · RUST · PORTABLE</text>
    <text x="140" y="82" fill="#F7F9FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="720">TextPilot</text>
    <text x="140" y="122" fill="#B8C4DD" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21">Select text. One gesture. A clearer prompt.</text>

    <g transform="translate(140 164)">
      <rect width="134" height="42" rx="12" fill="#151F39" stroke="#2B3A5F"/>
      <text x="67" y="28" text-anchor="middle" fill="#E8EEFF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">Ctrl × 2F8</text>
      <rect x="146" width="162" height="42" rx="12" fill="#151F39" stroke="#2B3A5F"/>
      <text x="227" y="28" text-anchor="middle" fill="#E8EEFF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">UI Automation</text>
      <rect x="320" width="136" height="42" rx="12" fill="#151F39" stroke="#2B3A5F"/>
      <text x="388" y="28" text-anchor="middle" fill="#E8EEFF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">≈ 1.3 MiB</text>
    </g>
  </g>

  <g id="workflow" transform="translate(690 62)">
    <path d="M64 64 H194 M244 64 H374" fill="none" stroke="#33456E" stroke-width="3" stroke-linecap="round"/>
    <path d="M187 57 L197 64 L187 71 M367 57 L377 64 L367 71" fill="none" stroke="#5C78B5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(0 0)">
      <rect width="128" height="128" rx="24" fill="#111A32" stroke="#2B3A5F"/>
      <rect x="24" y="31" width="80" height="12" rx="6" fill="#35476E"/>
      <rect x="24" y="55" width="62" height="12" rx="6" fill="url(#accent)"/>
      <rect x="24" y="79" width="74" height="12" rx="6" fill="#35476E"/>
      <text x="64" y="162" text-anchor="middle" fill="#C7D1E8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Read selection</text>
    </g>

    <g transform="translate(180 0)">
      <rect width="128" height="128" rx="24" fill="#111A32" stroke="#4E5FB0"/>
      <path d="M64 25 C66 47 76 58 98 64 C76 70 66 81 64 103 C62 81 52 70 30 64 C52 58 62 47 64 25 Z" fill="url(#accent)"/>
      <text x="64" y="162" text-anchor="middle" fill="#C7D1E8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Optimize</text>
    </g>

    <g transform="translate(360 0)">
      <rect width="128" height="128" rx="24" fill="#111A32" stroke="#2B3A5F"/>
      <rect x="34" y="28" width="60" height="76" rx="10" fill="#17233F" stroke="#6F86BB" stroke-width="3"/>
      <path d="M48 49 H80 M48 65 H80 M48 81 H69" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
      <text x="64" y="162" text-anchor="middle" fill="#C7D1E8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Copy result</text>
    </g>

    <g transform="translate(0 222)">
      <rect width="488" height="62" rx="18" fill="#10182D" stroke="#263653"/>
      <circle cx="31" cy="31" r="7" fill="#56D8A6"/>
      <text x="52" y="38" fill="#DCE5F8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">no window · stateless · clipboard</text>
    </g>
  </g>
</svg>
